name: VulcanForms
description: 'VulcanForms operates integrated digital metal manufacturing factories in the United States,
  combining in-house designed industrial-scale laser powder bed fusion (LPBF) additive machines, precision
  machining, automation, inspection, and proprietary AI-enabled software into a single end-to-end production
  workflow. The company produces mission-critical metal components at production scale for the aerospace,
  defense, medical, compute, consumer, and industrial sectors, compressing the supply chain into one secure,
  vertically integrated system. Headquartered in Devens, Massachusetts, VulcanForms is backed by Eclipse,
  1789 Capital, D1 Capital and others. This profile currently exposes no public developer API surface.'
